<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알고리즘 및 순서도 교육 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#10B981', // Emerald 500
                        admin: '#EF4444', // Red 500
                        canvasbg: '#F9FAFB',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F3F4F6; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        canvas { touch-action: none; } /* Prevent scrolling on canvas */
        
        /* Modal Animation */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800 overflow-hidden">

    <header class="bg-white shadow-sm z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path></svg>
                <h1 class="text-xl font-bold text-gray-800 hidden sm:block">알고리즘 & 순서도 마스터</h1>
                <h1 class="text-lg font-bold text-gray-800 sm:hidden">순서도 마스터</h1>
            </div>
            <div class="flex gap-2 bg-gray-100 p-1 rounded-lg">
                <button id="btnClassMode" class="px-3 sm:px-4 py-2 rounded-md bg-white shadow-sm text-primary font-semibold transition-all text-sm sm:text-base">수업 모드</button>
                <button id="btnAdminMode" class="px-3 sm:px-4 py-2 rounded-md text-gray-500 hover:bg-gray-200 font-medium transition-all text-sm sm:text-base">관리자 모드</button>
            </div>
        </div>
    </header>

    <section class="bg-white border-b border-gray-200 z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
                <!-- Class Mode Top Bar -->
                <div id="classTopBar" class="flex-1 flex flex-col md:flex-row gap-4 w-full">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-gray-700 mb-1">프로그램 선택</label>
                        <select id="programSelect" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-primary focus:border-primary">
                            <!-- Options populated dynamically -->
                        </select>
                    </div>
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-gray-700 mb-1">학생 이름</label>
                        <input type="text" id="studentName" placeholder="이름을 입력하세요" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-primary focus:border-primary">
                    </div>
                </div>

                <!-- Admin Mode Top Bar -->
                <div id="adminTopBar" class="flex-1 flex flex-col md:flex-row gap-4 w-full hidden">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-admin mb-1">관리자: 새 문제 제목</label>
                        <input type="text" id="adminTitle" placeholder="예: 토스트에 빵굽기" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-admin focus:border-admin">
                    </div>
                    <div class="flex-none flex items-end w-full md:w-auto mt-2 md:mt-0 gap-2">
                        <button id="btnDeleteProblem" class="w-full md:w-auto bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-md shadow transition-colors font-medium">문제 삭제</button>
                        <button id="btnSaveProblem" class="w-full md:w-auto bg-admin hover:bg-red-600 text-white px-4 py-2 rounded-md shadow transition-colors font-medium">문제 저장</button>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 bg-blue-50 p-3 rounded-md border border-blue-100">
                <h3 class="text-sm font-semibold text-blue-800 mb-1">프로그램 설명</h3>
                <p id="programDescription" class="text-sm text-blue-900 min-h-[1.5rem]">프로그램을 선택해주세요.</p>
                <!-- Admin description input -->
                <input type="text" id="adminDescription" placeholder="프로그램 설명을 입력하세요..." class="w-full border-gray-300 rounded-md shadow-sm p-2 border text-sm hidden mt-1">
            </div>
        </div>
    </section>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Column 1: Algorithm -->
        <div class="w-full md:w-1/3 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col h-1/3 md:h-full shrink-0">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center shrink-0">
                <h2 class="font-bold text-gray-700">1단계: 알고리즘 설계</h2>
                <div id="difficultySelector" class="flex gap-2 text-sm">
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="difficulty" value="basic" checked class="text-primary focus:ring-primary"> 기초
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer">
                        <input type="radio" name="difficulty" value="advanced" class="text-primary focus:ring-primary"> 심화
                    </label>
                </div>
            </div>
            <div class="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col relative">
                <!-- Class Mode View -->
                <div id="classAlgorithmView" class="flex-1 flex flex-col h-full relative">
                    <div id="basicAlgorithmWrapper" class="flex-1 h-full flex flex-col">
                        <div id="basicAlgorithmText" class="flex-1 bg-gray-100 rounded-lg p-4 text-gray-700 whitespace-pre-wrap font-mono text-sm leading-relaxed border border-gray-200 overflow-y-auto">
                            <!-- Pre-written algorithm shown here in basic mode -->
                        </div>
                    </div>
                    
                    <div id="advancedAlgorithmView" class="hidden flex-1 flex flex-col h-full relative">
                        <textarea id="studentAlgorithmInput" class="flex-1 w-full h-full border border-gray-300 rounded-lg p-4 font-mono text-sm resize-none focus:ring-2 focus:ring-primary focus:border-primary" placeholder="설명문을 보고 스스로 알고리즘을 번호순으로 입력해보세요.&#10;예)&#10;1. 시작&#10;2. ..."></textarea>
                        <button id="btnHint" class="absolute bottom-4 right-4 text-sm bg-yellow-100 text-yellow-800 hover:bg-yellow-200 px-3 py-1.5 rounded-md border border-yellow-300 transition-colors shadow-sm">선생님 힌트 보기</button>
                        
                        <!-- Hint Overlay -->
                        <div id="hintOverlay" class="absolute inset-0 bg-white/95 border border-yellow-300 rounded-lg p-4 font-mono text-sm text-gray-700 whitespace-pre-wrap hidden flex flex-col z-10 shadow-lg">
                            <span class="text-yellow-600 font-bold mb-2 flex items-center gap-1"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg> 힌트 (잠시 후 사라집니다)</span>
                            <div id="hintText" class="flex-1 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>

                <!-- Admin Mode View -->
                <div id="adminAlgorithmView" class="hidden flex-1 flex flex-col h-full">
                    <p class="text-xs text-red-500 mb-2 font-medium shrink-0">* 번호를 매겨 텍스트로 알고리즘을 작성하세요.</p>
                    <textarea id="adminAlgorithmInput" class="flex-1 w-full border border-red-300 rounded-lg p-4 font-mono text-sm resize-none focus:ring-2 focus:ring-admin focus:border-admin" placeholder="1. 시작&#10;2. 빵, 토스트기&#10;3. 토스트기에 전원을 연결한다."></textarea>
                </div>
            </div>
        </div>

        <!-- Column 2: Flowchart Menu -->
        <div class="w-full md:w-1/3 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col h-1/3 md:h-full relative shrink-0">
            <!-- Overlay to block interaction in admin mode -->
            <div id="adminBlockerOverlay" class="absolute inset-0 bg-gray-100/80 z-20 hidden flex items-center justify-center backdrop-blur-[1px]">
                <p class="text-gray-500 font-medium">관리자 모드에서는 문제만 출제합니다.</p>
            </div>

            <div class="p-4 bg-gray-50 border-b border-gray-200 shrink-0">
                <h2 class="font-bold text-gray-700">2단계: 순서도 도형 선택</h2>
            </div>
            
            <div class="flex-1 p-4 overflow-y-auto custom-scrollbar flex flex-col gap-4">
                
                <!-- Shape Selection Dropdown -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">도형 종류</label>
                    <select id="shapeSelect" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-secondary focus:border-secondary">
                        <option value="none">-- 도형을 선택하세요 --</option>
                        <option value="terminal">단말 (시작/종료)</option>
                        <option value="prepare">준비 (변수/초기화)</option>
                        <option value="process">처리 (작업 명시)</option>
                        <option value="io">입출력 (입력/출력)</option>
                        <option value="decision">비교/판단 (조건)</option>
                    </select>
                    <p id="shapeDesc" class="text-xs text-gray-500 mt-1 min-h-[2rem]">도형을 선택하면 설명이 나타납니다.</p>
                </div>

                <!-- Dynamic Input Area based on shape -->
                <div id="shapeInputArea" class="bg-gray-50 p-4 rounded-lg border border-gray-200 hidden flex-col gap-3 transition-all">
                    
                    <!-- Standard Text Input (Process, Data, Start/End) -->
                    <div id="standardInputGroup" class="hidden flex-col gap-2">
                        <label class="block text-sm font-medium text-gray-700">내용 입력</label>
                        <input type="text" id="standardTextInput" class="w-full border-gray-300 rounded-md p-2 border text-sm" placeholder="내용을 입력하세요">
                    </div>

                    <!-- Condition Sub-menu & Inputs -->
                    <div id="conditionInputGroup" class="hidden flex-col gap-3">
                        <label class="block text-sm font-medium text-gray-700">조건 종류</label>
                        <select id="conditionTypeSelect" class="w-full border-gray-300 rounded-md p-2 border text-sm">
                            <option value="if">1. if 문 (예일 경우만 행동)</option>
                            <option value="ifelse">2. if~else 문 (예/아니오 모두 행동)</option>
                            <option value="loop">3. 반복문 (아니오일 경우 위로 되돌아감)</option>
                        </select>

                        <!-- Main Condition text -->
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">조건 (예: 빵이 구워졌는가?)</label>
                            <input type="text" id="condMainText" class="w-full border-gray-300 rounded-md p-2 border text-sm" placeholder="조건문 입력">
                        </div>
                        
                        <!-- True Action -->
                        <div>
                            <label class="block text-xs text-blue-600 mb-1 font-semibold">참(Yes)일 때 행동</label>
                            <div class="flex gap-2">
                                <select id="condTrueShape" class="w-1/3 border-blue-200 rounded-md p-2 border text-sm bg-blue-50 text-blue-800 outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="process">처리 (직사각형)</option>
                                    <option value="terminal">단말 (타원)</option>
                                    <option value="prepare">준비 (육각형)</option>
                                    <option value="io">입출력 (평행사변형)</option>
                                </select>
                                <input type="text" id="condTrueText" class="flex-1 w-full border-blue-200 rounded-md p-2 border text-sm bg-blue-50" placeholder="예: 잼을 바른다">
                            </div>
                        </div>

                        <!-- False Action (only for if-else, else-if) -->
                        <div id="condFalseGroup" class="hidden">
                            <label id="condFalseLabel" class="block text-xs text-red-600 mb-1 font-semibold">거짓(No)일 때 행동</label>
                            <div class="flex gap-2">
                                <select id="condFalseShape" class="w-1/3 border-red-200 rounded-md p-2 border text-sm bg-red-50 text-red-800 outline-none focus:ring-1 focus:ring-red-500">
                                    <option value="process">처리 (직사각형)</option>
                                    <option value="terminal">단말 (타원)</option>
                                    <option value="prepare">준비 (육각형)</option>
                                    <option value="io">입출력 (평행사변형)</option>
                                </select>
                                <input type="text" id="condFalseText" class="flex-1 w-full border-red-200 rounded-md p-2 border text-sm bg-red-50" placeholder="예: 접시에 담는다">
                            </div>
                        </div>
                    </div>

                    <button id="btnAddShape" class="w-full bg-secondary hover:bg-emerald-600 text-white py-2 rounded-md font-medium transition-colors mt-2 shadow-sm">순서도에 추가 ➔</button>
                </div>
                
                <div class="mt-auto pt-4 border-t border-gray-200">
                     <button id="btnResetFlowchart" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 py-2 rounded-md text-sm font-medium transition-colors mb-2">순서도 초기화</button>
                </div>

            </div>
        </div>

        <!-- Column 3: Canvas -->
        <div class="w-full md:w-1/3 bg-canvasbg flex flex-col h-1/3 md:h-full relative min-h-[300px]">
            <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center z-10 shadow-sm shrink-0">
                <h2 class="font-bold text-gray-700">3단계: 시뮬레이션 결과</h2>
                <div class="flex gap-2">
                    <button id="btnEnlargeImage" class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-md text-sm font-medium transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg> <span>크게 보기</span>
                    </button>
                    <button id="btnDownload" class="bg-indigo-50 text-primary border border-indigo-200 hover:bg-indigo-100 px-3 py-1.5 rounded-md text-sm font-medium transition-colors flex items-center gap-1">
                        <svg class="w-4 h-4 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> <span>이미지 저장</span>
                    </button>
                </div>
            </div>
            <div class="flex-1 overflow-auto custom-scrollbar relative p-4 flex justify-center bg-gray-50" id="canvasContainer">
                <canvas id="flowchartCanvas" class="bg-white shadow-sm border border-gray-200 rounded-lg block"></canvas>
            </div>
        </div>
    </main>

    <!-- Node Edit Modal -->
    <div id="nodeEditModal" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-xl shadow-xl w-96 max-w-[90%] overflow-hidden modal-content">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800">도형 수정</h3>
                <button id="btnCancelNodeEditX" class="text-gray-400 hover:text-gray-600 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="px-6 py-4 flex flex-col gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">내용</label>
                    <input type="text" id="editNodeText" class="w-full border-gray-300 rounded-md p-2 border focus:ring-primary focus:border-primary text-sm">
                </div>
                
                <div id="editNodeCondGroup" class="hidden flex-col gap-3 border-t border-gray-100 pt-3 mt-1">
                    <div>
                        <label class="block text-xs font-semibold text-blue-600 mb-1">참(Yes)일 때 행동</label>
                        <input type="text" id="editNodeTrueText" class="w-full border-blue-200 bg-blue-50 rounded-md p-2 border focus:ring-blue-500 text-sm">
                    </div>
                    <div id="editNodeFalseGroup" class="hidden">
                        <label class="block text-xs font-semibold text-red-600 mb-1">거짓(No)일 때 행동</label>
                        <input type="text" id="editNodeFalseText" class="w-full border-red-200 bg-red-50 rounded-md p-2 border focus:ring-red-500 text-sm">
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-between gap-2 border-t border-gray-100">
                <button id="btnDeleteNode" class="px-4 py-2 rounded-md bg-red-100 hover:bg-red-200 text-red-700 text-sm font-medium transition-colors">이 도형 삭제</button>
                <div class="flex gap-2">
                    <button id="btnCancelNodeEdit" class="px-4 py-2 rounded-md bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm font-medium transition-colors">취소</button>
                    <button id="btnSaveNode" class="px-4 py-2 rounded-md bg-primary hover:bg-indigo-700 text-white text-sm font-medium shadow-sm transition-colors">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal System (replaces alert/prompt) -->
    <div id="customModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center modal-overlay">
        <div class="bg-white rounded-xl shadow-xl w-96 max-w-[90%] overflow-hidden modal-content">
            <div id="modalHeader" class="px-6 py-4 border-b border-gray-100 flex items-center gap-3">
                <div id="modalIcon" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></div>
                <h3 id="modalTitle" class="text-lg font-bold text-gray-800">알림</h3>
            </div>
            <div class="px-6 py-4">
                <p id="modalMessage" class="text-gray-600 text-sm whitespace-pre-wrap"></p>
                <div id="modalInputContainer" class="mt-4 hidden">
                    <input type="password" id="modalInput" class="w-full border-gray-300 rounded-md p-2 border focus:ring-primary focus:border-primary text-center" placeholder="비밀번호 입력">
                    <p id="modalError" class="text-red-500 text-xs mt-1 hidden">비밀번호가 틀렸습니다.</p>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end gap-2 border-t border-gray-100">
                <button id="modalBtnCancel" class="px-4 py-2 rounded-md bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm font-medium hidden">취소</button>
                <button id="modalBtnConfirm" class="px-4 py-2 rounded-md bg-primary hover:bg-indigo-700 text-white text-sm font-medium shadow-sm">확인</button>
            </div>
        </div>
    </div>

    <!-- Image Modal for Completion -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center modal-overlay p-4">
        <div class="bg-white p-2 rounded-xl shadow-2xl max-w-full max-h-full flex flex-col modal-content relative">
            <div class="flex justify-between items-center p-3 border-b">
                <h3 id="imageModalTitle" class="text-xl font-bold text-gray-800">🎉 순서도 완성! 🎉</h3>
                <button id="btnCloseImageModal" class="text-gray-500 hover:text-gray-800 transition-colors">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="overflow-auto flex-1 p-4 bg-gray-50 flex justify-center custom-scrollbar">
                <img id="completedImage" src="" alt="완성된 순서도" class="max-w-full object-contain rounded border border-gray-200 bg-white">
            </div>
            <div class="p-4 bg-gray-100 rounded-b-xl flex justify-center border-t border-gray-200">
                <button id="btnDownloadFromModal" class="bg-primary hover:bg-indigo-700 text-white px-8 py-2.5 rounded-md font-bold shadow-md transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> 이미지 내PC 저장
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const AppState = {
            isAdmin: false,
            difficulty: 'basic', 
            problems: [],
            currentProblemIndex: 0,
            flowchartNodes: [], // User built flowchart
            renderedNodes: [],  // Stored for click detection {index, x, y, w, h}
            canvasWidth: 600,
            canvasHeight: 800
        };

        // Default Problem Data
        const defaultProblems = [
            {

                    inputCont.classList.remove('hidden');
                    btnCancel.classList.remove('hidden');
                    setTimeout(() => inputEl.focus(), 100);
                } else if (type === 'confirm') {
                    iconEl.classList.add('bg-yellow-100', 'text-yellow-600');
                    iconEl.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
                    btnCancel.classList.remove('hidden');

                    iconEl.classList.add('bg-gray-100', 'text-gray-500');
                    iconEl.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
                }

                modal.classList.remove('hidden');

                const cleanup = () => {
                    modal.classList.add('hidden');
                    btnConfirm.onclick = null;
                    btnCancel.onclick = null;
                    inputEl.onkeydown = null;
                };

                btnCancel.onclick = () => { cleanup(); if(type === 'prompt' && inputCallback) inputCallback(null); };
                
                btnConfirm.onclick = () => {

            }

        // --- Initialization and Events ---
        function init() {
            loadProblems();

                resizeCanvas();
                drawCanvas();
            }, 100); 
            
            window.addEventListener('resize', () => {
                resizeCanvas();
                drawCanvas();
            });
        }

        function loadProblems() {
            try {
                const stored = localStorage.getItem('flowchart_problems_v2');
                if (stored) {
                    AppState.problems = JSON.parse(stored);
                } else {
                    AppState.problems = [...defaultProblems];
                    saveProblems();
                }
            } catch (e) {
                AppState.problems = [...defaultProblems];
            }
            populateProgramSelect();
        }

        function saveProblems() {
            localStorage.setItem('flowchart_problems_v2', JSON.stringify(AppState.problems));
        }

        function populateProgramSelect() {
            els.programSelect.innerHTML = '';
            AppState.problems.forEach((p, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = p.title;
                els.programSelect.appendChild(option);
            });
            
            if (AppState.currentProblemIndex >= AppState.problems.length) {
                AppState.currentProblemIndex = 0;
            }
            
            els.programSelect.value = AppState.currentProblemIndex;
            loadCurrentProblem();
        }

            els.btnClassMode.addEventListener('click', () => setMode(false));
            els.btnAdminMode.addEventListener('click', () => {
                if(AppState.isAdmin) return; 
                Modal.show('관리자 인증', '관리자 비밀번호를 입력하세요. (기본: 1234)', 'prompt', (pwd) => {
                    if (pwd === '1234') {
                        setMode(true);
                        return true; 
                    } else {
                        return false; 
                    }
                });

        // --- Canvas Interaction (Click to Edit) ---
        function setupCanvasInteraction() {
            els.canvas.addEventListener('mousemove', (e) => {
                if (AppState.flowchartNodes.length === 0) return;
                const hit = getClickedNodeIndex(e);
                els.canvas.style.cursor = hit > -1 ? 'pointer' : 'default';
            });

            els.canvas.addEventListener('click', (e) => {
                if (AppState.flowchartNodes.length === 0) return;
                const hitIndex = getClickedNodeIndex(e);
                
                if (hitIndex > -1) {
                    openEditModal(hitIndex);
                }
            });
        }

        function getClickedNodeIndex(e) {
            const rect = els.canvas.getBoundingClientRect();
            const scaleX = els.canvas.width / rect.width;
            const scaleY = els.canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            // Iterate backwards (top layer first)
            for (let i = AppState.renderedNodes.length - 1; i >= 0; i--) {
                const rn = AppState.renderedNodes[i];
                if (clickX >= rn.x - rn.w/2 && clickX <= rn.x + rn.w/2 &&
                    clickY >= rn.y - rn.h/2 && clickY <= rn.y + rn.h/2) {
                    return rn.index;
                }
            }
            return -1;
        }

        function openEditModal(index) {
            editingNodeIndex = index;
            const node = AppState.flowchartNodes[index];
            
            els.editNodeText.value = node.text || '';
            
            if (node.type === 'decision') {
                els.editNodeCondGroup.classList.remove('hidden');
                els.editNodeCondGroup.classList.add('flex');
                els.editNodeTrueText.value = node.trueText || '';
                
                if (node.condType === 'ifelse') {
                    els.editNodeFalseGroup.classList.remove('hidden');
                    els.editNodeFalseText.value = node.falseText || '';
                } else {
                    els.editNodeFalseGroup.classList.add('hidden');
                }
            } else {
                els.editNodeCondGroup.classList.add('hidden');
                els.editNodeCondGroup.classList.remove('flex');
            }
            
            els.nodeEditModal.classList.remove('hidden');
        }

        function setupNodeEditModalEvents() {
            const closeAndDraw = () => {
                els.nodeEditModal.classList.add('hidden');
                editingNodeIndex = -1;
                drawCanvas();
            };

            els.btnCancelNodeEdit.addEventListener('click', closeAndDraw);
            els.btnCancelNodeEditX.addEventListener('click', closeAndDraw);

            els.btnSaveNode.addEventListener('click', () => {
                if (editingNodeIndex > -1) {
                    const node = AppState.flowchartNodes[editingNodeIndex];
                    node.text = els.editNodeText.value.trim();
                    if (node.type === 'decision') {
                        node.trueText = els.editNodeTrueText.value.trim();
                        if (node.condType === 'ifelse') {
                            node.falseText = els.editNodeFalseText.value.trim();
                        }
                    }
                    closeAndDraw();
                }
            });

            els.btnDeleteNode.addEventListener('click', () => {
                if (editingNodeIndex > -1) {
                    if (editingNodeIndex === 0 && AppState.flowchartNodes[0].type === ShapeTypes.TERMINAL && AppState.flowchartNodes[0].text === '시작') {
                        Modal.show('알림', '시작 도형은 삭제할 수 없습니다.', 'info');
                        return;
                    }
                    
                    Modal.show('도형 삭제', '선택한 도형을 삭제하시겠습니까?', 'confirm', () => {
                        AppState.flowchartNodes.splice(editingNodeIndex, 1);
                        closeAndDraw();
                    });
                }
            });
        }


        // --- UI Update Logic ---
        function setMode(isAdmin) {
            AppState.isAdmin = isAdmin;
            
            if (isAdmin) {
                els.btnAdminMode.classList.replace('text-gray-500', 'bg-admin');
                els.btnAdminMode.classList.replace('hover:bg-gray-200', 'text-white');
                els.btnAdminMode.classList.add('shadow-sm');
                
                els.btnClassMode.classList.remove('bg-white', 'shadow-sm', 'text-primary');
                els.btnClassMode.classList.add('text-gray-500', 'hover:bg-gray-200');
            } else {
                els.btnClassMode.classList.remove('text-gray-500', 'hover:bg-gray-200');
                els.btnClassMode.classList.add('bg-white', 'shadow-sm', 'text-primary');

                els.btnAdminMode.classList.replace('bg-admin', 'text-gray-500');
                els.btnAdminMode.classList.replace('text-white', 'hover:bg-gray-200');
                els.btnAdminMode.classList.remove('shadow-sm');
            }

            els.adminTopBar.classList.toggle('hidden', !isAdmin);
            els.classTopBar.classList.toggle('hidden', isAdmin);
            els.programDescription.classList.toggle('hidden', isAdmin);
            els.adminDescription.classList.toggle('hidden', !isAdmin);
            els.classAlgorithmView.classList.toggle('hidden', isAdmin);
            els.adminAlgorithmView.classList.toggle('hidden', !isAdmin);
            document.getElementById('difficultySelector').classList.toggle('hidden', isAdmin);
            els.adminBlockerOverlay.classList.toggle('hidden', !isAdmin);

            if (isAdmin) {
                const prob = AppState.problems[AppState.currentProblemIndex] || {title:'', description:'', algorithm:''};
                els.adminTitle.value = prob.title;
                els.adminDescription.value = prob.description;
                els.adminAlgorithmInput.value = prob.algorithm;
            } else {
                loadCurrentProblem();
            }
            
            drawCanvas(); 
        }

        function updateDifficultyUI() {
            if (AppState.difficulty === 'basic') {
                els.basicAlgorithmWrapper.classList.remove('hidden');
                els.advancedAlgorithmView.classList.add('hidden');
            } else {
                els.basicAlgorithmWrapper.classList.add('hidden');
                els.advancedAlgorithmView.classList.remove('hidden');
            }
        }

        function loadCurrentProblem() {
            const prob = AppState.problems[AppState.currentProblemIndex];
            if (!prob) return;
            
            els.programDescription.textContent = prob.description;
            els.basicAlgorithmText.textContent = prob.algorithm;
            els.studentAlgorithmInput.value = ''; 
            
            if (!AppState.isAdmin) {
                AppState.flowchartNodes = [{ type: ShapeTypes.TERMINAL, id: Date.now(), text: '시작' }];
                els.shapeSelect.value = 'none';
                handleShapeSelection();
                drawCanvas();
            }
        }

        function saveAdminProblem() {
            const title = els.adminTitle.value.trim();
            const desc = els.adminDescription.value.trim();
            const algo = els.adminAlgorithmInput.value.trim();

            if (!title || !algo) {
                Modal.show('오류', '문제 제목과 알고리즘 내용은 필수입니다.', 'error');
                return;
            }

            const newProb = { title, description: desc, algorithm: algo };
            const existingIndex = AppState.problems.findIndex(p => p.title === title);
            
            if (existingIndex >= 0) {
                AppState.problems[existingIndex] = newProb;
                AppState.currentProblemIndex = existingIndex;
            } else {
                AppState.problems.push(newProb);
                AppState.currentProblemIndex = AppState.problems.length - 1;
            }
            
            saveProblems();
            populateProgramSelect();
            Modal.show('성공', '문제가 성공적으로 저장되었습니다.', 'success');
        }

        function deleteAdminProblem() {
            if (AppState.problems.length <= 1) {
                Modal.show('삭제 불가', '최소 1개의 문제는 남겨두어야 합니다.', 'error');
                return;
            }

            Modal.show('문제 삭제', '현재 이 문제를 삭제하시겠습니까?\n삭제 후 복구할 수 없습니다.', 'confirm', () => {
                AppState.problems.splice(AppState.currentProblemIndex, 1);
                AppState.currentProblemIndex = 0;
                saveProblems();
                populateProgramSelect();
                
                const prob = AppState.problems[AppState.currentProblemIndex];
                els.adminTitle.value = prob.title;
                els.adminDescription.value = prob.description;
                els.adminAlgorithmInput.value = prob.algorithm;

                Modal.show('성공', '문제가 삭제되었습니다.', 'success');
            });
        }

        // --- Handling shape logic ---
        function handleShapeSelection() {
            const val = els.shapeSelect.value;
            els.shapeInputArea.classList.remove('hidden', 'flex');
            els.standardInputGroup.classList.add('hidden', 'flex');
            els.conditionInputGroup.classList.add('hidden', 'flex');

            if (val === 'none') {
                els.shapeDesc.textContent = '도형을 선택하면 설명이 나타납니다.';
                return;
            }

            els.shapeInputArea.classList.add('flex');
            els.shapeInputArea.classList.remove('hidden');

            const descriptions = {
                'terminal': '순서도의 시작과 끝을 나타냅니다. (예: 시작, 종료)',
                'prepare': '변수의 선언이나 준비 상태를 설정합니다. (예: 빵, 토스트기)',
                'process': '실제 처리할 작업이나 연산을 나타냅니다. (예: 잼을 바른다)',
                'io': '데이터의 입력이나 출력을 나타냅니다. (예: 빵을 넣는다)',
                'decision': '조건을 판단하여 흐름을 분기합니다. (예: 빵이 구워졌는가?)'
            };
            els.shapeDesc.textContent = descriptions[val];

            if (val === 'decision') {
                els.conditionInputGroup.classList.remove('hidden');
                els.conditionInputGroup.classList.add('flex');
                handleConditionTypeChange(); 
            } else {
                els.standardInputGroup.classList.remove('hidden');
                els.standardInputGroup.classList.add('flex');
                
                if (val === 'terminal') els.standardTextInput.placeholder = '예: 시작 또는 종료';
                else if (val === 'prepare') els.standardTextInput.placeholder = '예: 빵, 토스트기 준비';
                else els.standardTextInput.placeholder = '내용을 입력하세요';
                
                els.standardTextInput.value = '';
            }
        }

        function handleConditionTypeChange() {
            const val = els.conditionTypeSelect.value;
            if (val === 'ifelse') {
                els.condFalseGroup.classList.remove('hidden');
            } else {
                els.condFalseGroup.classList.add('hidden');
            }
        }

        function addShapeToFlowchart() {
            if (AppState.flowchartNodes.length > 0) {
                const lastNode = AppState.flowchartNodes[AppState.flowchartNodes.length - 1];
                if (lastNode.type === ShapeTypes.TERMINAL && (lastNode.text.includes('종료') || lastNode.text.includes('끝'))) {
                    Modal.show('알림', '이미 순서도가 종료되었습니다. 도형을 더 추가할 수 없습니다.', 'info');
                    return;
                }
            }

            const type = els.shapeSelect.value;
            if (type === 'none') {
                Modal.show('알림', '먼저 순서도에 추가할 도형을 선택하세요.', 'info');
                return;
            }

            let node = { type, id: Date.now() };

            if (type === 'decision') {
                node.condType = els.conditionTypeSelect.value;
                node.text = els.condMainText.value.trim();
                node.trueShape = els.condTrueShape.value;
                node.trueText = els.condTrueText.value.trim();
                
                if (node.condType === 'ifelse') {
                    node.falseShape = els.condFalseShape.value;
                    node.falseText = els.condFalseText.value.trim();
                }
                
                if (!node.text || !node.trueText || (node.condType === 'ifelse' && !node.falseText)) {
                    Modal.show('입력 확인', '조건과 그에 따른 행동을 모두 입력해주세요.', 'info');
                    return;
                }
            } else {
                node.text = els.standardTextInput.value.trim();
                if (!node.text) {
                    Modal.show('입력 확인', '도형 안에 들어갈 내용을 입력해주세요.', 'info');
                    return;
                }
            }

            AppState.flowchartNodes.push(node);
            
            els.standardTextInput.value = '';
            els.condMainText.value = '';
            els.condTrueText.value = '';
            els.condFalseText.value = '';
            els.condTrueShape.value = 'process';
            if (els.condFalseShape) els.condFalseShape.value = 'process';
            
            if(type !== 'decision') {
                els.standardTextInput.focus();
            }
            
            drawCanvas();
            
            setTimeout(() => {
                els.canvasContainer.scrollTop = els.canvasContainer.scrollHeight;
            }, 50);

            if (node.type === ShapeTypes.TERMINAL && (node.text.includes('종료') || node.text.includes('끝'))) {
                setTimeout(() => {
                    showCompletionPopup(true);
                }, 300); 
            }
        }

        function showCompletionPopup(isCompletion = true) {
            drawCanvas(); 
            try {
                const dataUrl = els.canvas.toDataURL('image/png');
                els.completedImage.src = dataUrl;
                els.imageModalTitle.textContent = isCompletion ? "🎉 순서도 완성! 🎉" : "순서도 크게 보기";
                els.imageModal.classList.remove('hidden');
            } catch (err) {
                console.error("팝업 이미지 생성 실패", err);
            }
        }

        // --- Canvas Rendering ---
        function resizeCanvas() {
            const containerWidth = els.canvasContainer.clientWidth;
            AppState.canvasWidth = Math.max(containerWidth - 32, 300); 
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            let words = text.split(' ');
            let line = '';
            let lines = [];

            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());
            
            let currentY = y - ((lines.length - 1) * lineHeight) / 2;
            for(let i=0; i<lines.length; i++) {
                context.fillText(lines[i], x, currentY);
                currentY += lineHeight;
            }
        }

        function drawShape(ctx, type, x, y, w, h, style, text) {
            ctx.fillStyle = style.bg;
            ctx.strokeStyle = style.border;
            ctx.lineWidth = 2;
            ctx.beginPath();

            switch (type) {
                case ShapeTypes.TERMINAL:
                    const radius = h / 2;
                    ctx.moveTo(x - w/2 + radius, y - h/2);
                    ctx.lineTo(x + w/2 - radius, y - h/2);
                    ctx.arc(x + w/2 - radius, y, radius, -Math.PI/2, Math.PI/2);
                    ctx.lineTo(x - w/2 + radius, y + h/2);
                    ctx.arc(x - w/2 + radius, y, radius, Math.PI/2, -Math.PI/2);
                    ctx.closePath();
                    break;
                case ShapeTypes.PREPARE:
                    const hexEdge = Math.min(20, w * 0.1);
                    ctx.moveTo(x - w/2 + hexEdge, y - h/2);
                    ctx.lineTo(x + w/2 - hexEdge, y - h/2);
                    ctx.lineTo(x + w/2, y);
                    ctx.lineTo(x + w/2 - hexEdge, y + h/2);
                    ctx.lineTo(x - w/2 + hexEdge, y + h/2);
                    ctx.lineTo(x - w/2, y);
                    ctx.closePath();
                    break;
                case ShapeTypes.PROCESS:
                    ctx.rect(x - w/2, y - h/2, w, h);
                    break;
                case ShapeTypes.IO:
                    const offset = Math.min(20, w * 0.1);
                    ctx.moveTo(x - w/2 + offset, y - h/2);
                    ctx.lineTo(x + w/2, y - h/2);
                    ctx.lineTo(x + w/2 - offset, y + h/2);
                    ctx.lineTo(x - w/2, y + h/2);
                    ctx.closePath();
                    break;
                case ShapeTypes.DECISION:
                    ctx.moveTo(x, y - h/2);
                    ctx.lineTo(x + w/2, y);
                    ctx.lineTo(x, y + h/2);
                    ctx.lineTo(x - w/2, y);
                    ctx.closePath();
                    break;
            }

            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = style.text;
            ctx.font = '500 14px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const textMaxWidth = type === ShapeTypes.DECISION ? w - 40 : w - 20;
            wrapText(ctx, text || '', x, y, textMaxWidth, 20);
        }

        function drawArrow(ctx, fromX, fromY, toX, toY, text = '', isVertical = true) {
            ctx.strokeStyle = '#9CA3AF';
            ctx.fillStyle = '#9CA3AF';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - 10 * Math.cos(angle - Math.PI/6), toY - 10 * Math.sin(angle - Math.PI/6));
            ctx.lineTo(toX - 10 * Math.cos(angle + Math.PI/6), toY - 10 * Math.sin(angle + Math.PI/6));
            ctx.closePath();
            ctx.fill();

            if (text) {
                ctx.fillStyle = '#4B5563'; 
                ctx.font = '600 12px "Noto Sans KR"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                
                let textX = (fromX + toX) / 2;
                let textY = (fromY + toY) / 2;
                
                if (isVertical) {
                    textX += 15;
                    textY += 5;
                } else {
                    textY -= 5;
                }
                
                ctx.fillText(text, textX, textY);
            }
        }

        function drawCanvas() {
            AppState.renderedNodes = []; // Reset hitboxes
            
            const baseNodeWidth = 180;
            const nodeHeight = 50;
            const spacing = 40;
            
            const actualW = Math.min(baseNodeWidth, AppState.canvasWidth * 0.8);
            const actualDiamondW = Math.min(baseNodeWidth + 20, AppState.canvasWidth * 0.8);
            
            let estimatedHeight = 50;
            for (let i = 0; i < AppState.flowchartNodes.length; i++) {
                const node = AppState.flowchartNodes[i];
                if (node.type === 'decision') {
                    estimatedHeight += nodeHeight + 20 + spacing; 
                    estimatedHeight += nodeHeight + spacing; 
                } else {
                    estimatedHeight += nodeHeight + spacing;
                }
            }
            
            const minHeight = els.canvasContainer.clientHeight - 32;
            AppState.canvasHeight = Math.max(estimatedHeight + 50, minHeight);
            
            els.canvas.width = AppState.canvasWidth;
            els.canvas.height = AppState.canvasHeight;
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, els.canvas.width, els.canvas.height);

            if (AppState.flowchartNodes.length === 0) return;

            let drawY = 50;
            const centerX = AppState.canvasWidth / 2;
            let lastX = centerX;
            let lastBottomY = 0;

            AppState.flowchartNodes.forEach((node, index) => {
                const isLast = index === AppState.flowchartNodes.length - 1;
                const style = ShapeStyles[node.type];
                
                if (index > 0) {
                    drawArrow(ctx, lastX, lastBottomY, centerX, drawY);
                }

                if (node.type === 'decision') {
                    const diamondH = nodeHeight + 30;
                    drawShape(ctx, node.type, centerX, drawY, actualDiamondW, diamondH, style, node.text);
                    AppState.renderedNodes.push({ index, x: centerX, y: drawY, w: actualDiamondW, h: diamondH });
                    
                    const branchY = drawY + diamondH/2 + spacing;
                    
                    if (node.condType === 'loop') {
                        const trueBlockX = centerX;
                        const trueBlockY = branchY;
                        
                        // True Path
                        drawArrow(ctx, centerX, drawY + diamondH/2, trueBlockX, trueBlockY - nodeHeight/2, '예(True)', true);
                        
                        // False Loop Path (우->상->좌 화살표)
                        const offsetRight = Math.min(actualDiamondW, (AppState.canvasWidth / 2) - 20);
                        const falseX = centerX + offsetRight;
                        
                        ctx.beginPath();
                        ctx.moveTo(centerX + actualDiamondW/2, drawY); // 우측 모서리
                        ctx.lineTo(falseX, drawY);
                        const topY = drawY - diamondH/2 - 15;
                        ctx.lineTo(falseX, topY);
                        ctx.lineTo(centerX, topY);
                        ctx.lineTo(centerX, drawY - diamondH/2); // 위쪽 모서리
                        ctx.strokeStyle = '#EF4444'; // Red line
                        ctx.stroke();
                        
                        // 루프 화살표 머리
                        ctx.beginPath();
                        ctx.moveTo(centerX, drawY - diamondH/2);
                        ctx.lineTo(centerX - 6, drawY - diamondH/2 - 10);
                        ctx.lineTo(centerX + 6, drawY - diamondH/2 - 10);
                        ctx.fillStyle = '#EF4444';
                        ctx.fill();

                        ctx.fillStyle = '#EF4444'; 
                        ctx.font = '600 12px "Noto Sans KR"';
                        ctx.textAlign = 'left';
                        ctx.fillText('아니오(되돌아감)', centerX + actualDiamondW/2 + 5, drawY - 5);
                        
                        // True Action Block
                        const trueShapeType = node.trueShape || ShapeTypes.PROCESS;
                        const trueH = trueShapeType === ShapeTypes.DECISION ? nodeHeight + 30 : nodeHeight;
                        drawShape(ctx, trueShapeType, trueBlockX, trueBlockY, actualW, trueH, ShapeStyles[trueShapeType], node.trueText);
                        AppState.renderedNodes.push({ index, x: trueBlockX, y: trueBlockY, w: actualW, h: trueH });

                        lastBottomY = trueBlockY + trueH/2;
                        drawY = branchY + trueH/2 + spacing;

                    } else if (node.condType === 'ifelse') {
                        const offsetRight = Math.min(actualW + 20, (AppState.canvasWidth / 2) - 20);
                        const trueBlockX = centerX;
                        const trueBlockY = branchY;
                        const falseBlockX = centerX + offsetRight;
                        const falseBlockY = branchY;

                        drawArrow(ctx, centerX, drawY + diamondH/2, trueBlockX, trueBlockY - nodeHeight/2, '예(True)', true);
                        
                        ctx.beginPath();
                        ctx.moveTo(centerX + actualDiamondW/2, drawY);
                        ctx.lineTo(falseBlockX, drawY);
                        ctx.lineTo(falseBlockX, falseBlockY - nodeHeight/2 - 10);
                        ctx.strokeStyle = '#9CA3AF';
                        ctx.stroke();
                        
                        drawArrow(ctx, falseBlockX, falseBlockY - nodeHeight/2 - 10, falseBlockX, falseBlockY - nodeHeight/2, '아니오(False)', true);

                        const trueShapeType = node.trueShape || ShapeTypes.PROCESS;
                        const falseShapeType = node.falseShape || ShapeTypes.PROCESS;
                        
                        const trueH = trueShapeType === ShapeTypes.DECISION ? nodeHeight + 30 : nodeHeight;
                        const falseH = falseShapeType === ShapeTypes.DECISION ? nodeHeight + 30 : nodeHeight;

                        drawShape(ctx, trueShapeType, trueBlockX, trueBlockY, actualW, trueH, ShapeStyles[trueShapeType], node.trueText);
                        AppState.renderedNodes.push({ index, x: trueBlockX, y: trueBlockY, w: actualW, h: trueH });
                        
                        drawShape(ctx, falseShapeType, falseBlockX, falseBlockY, actualW, falseH, ShapeStyles[falseShapeType], node.falseText);
                        AppState.renderedNodes.push({ index, x: falseBlockX, y: falseBlockY, w: actualW, h: falseH });

                        if (!isLast) {
                            const maxH = Math.max(trueH, falseH);
                            const mergeY = trueBlockY + maxH/2 + spacing/2;
                            
                            ctx.beginPath();
                            ctx.moveTo(trueBlockX, trueBlockY + trueH/2);
                            ctx.lineTo(trueBlockX, mergeY);
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.moveTo(falseBlockX, falseBlockY + falseH/2);
                            ctx.lineTo(falseBlockX, mergeY);
                            ctx.lineTo(trueBlockX, mergeY);
                            ctx.stroke();
                            
                            lastBottomY = mergeY;
                        } else {
                            lastBottomY = trueBlockY + trueH/2;
                        }
                        
                        drawY = branchY + Math.max(trueH, falseH)/2 + spacing;

                    } else {
                        const trueBlockX = centerX;
                        const trueBlockY = branchY;
                        
                        drawArrow(ctx, centerX, drawY + diamondH/2, trueBlockX, trueBlockY - nodeHeight/2, '예(True)', true);
                        
                        const trueShapeType = node.trueShape || ShapeTypes.PROCESS;
                        const trueH = trueShapeType === ShapeTypes.DECISION ? nodeHeight + 30 : nodeHeight;
                        
                        drawShape(ctx, trueShapeType, trueBlockX, trueBlockY, actualW, trueH, ShapeStyles[trueShapeType], node.trueText);
                        AppState.renderedNodes.push({ index, x: trueBlockX, y: trueBlockY, w: actualW, h: trueH });

                        ctx.fillStyle = '#EF4444'; 
                        ctx.font = '12px "Noto Sans KR"';
                        ctx.textAlign = 'left';
                        const falseStartX = centerX + actualDiamondW/2 + 10;
                        if (falseStartX < AppState.canvasWidth - 20) {
                             ctx.fillText('아니오 ➔ 넘어감', falseStartX, drawY);
                        }

                        lastBottomY = trueBlockY + trueH/2;
                        drawY = branchY + trueH/2 + spacing;
                    }

                } else {
                    drawShape(ctx, node.type, centerX, drawY, actualW, nodeHeight, style, node.text);
                    AppState.renderedNodes.push({ index, x: centerX, y: drawY, w: actualW, h: nodeHeight });
                    
                    lastBottomY = drawY + nodeHeight/2;
                    drawY += nodeHeight + spacing;
                }
                
                lastX = centerX;
            });
            
            const sName = els.studentName.value.trim();
            if (sName && !AppState.isAdmin && AppState.flowchartNodes.length > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(79, 70, 229, 0.05)'; 
                ctx.font = 'bold 48px "Noto Sans KR"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.translate(AppState.canvasWidth/2, AppState.canvasHeight/2);
                ctx.rotate(-Math.PI/6); 
                ctx.fillText(`${sName}의 순서도`, 0, 0);
                ctx.restore();
            }
        }

        function downloadCanvas() {
            if (AppState.flowchartNodes.length <= 1) { 
                Modal.show('저장 실패', '내용을 추가하여 순서도를 완성한 후 저장해주세요.', 'error');
                return;
            }
            
            const student = els.studentName.value.trim();
            if (!student && !AppState.isAdmin) {
                Modal.show('학생 이름 입력', '자신의 결과물임을 증명하기 위해 상단에 이름을 먼저 입력해주세요.', 'info');
                els.studentName.focus();
                return;
            }
            
            drawCanvas(); 
            
            try {
                const dataUrl = els.canvas.toDataURL('image/png');
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = `순서도_${student || '선생님'}_${new Date().toISOString().slice(0,10)}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (err) {
                Modal.show('저장 오류', '이미지를 저장하는 중 문제가 발생했습니다.', 'error');
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
